stage_name: stage_a
epochs: 1.0
batch_size: 16
max_length: 4096
bf16: true
gradient_checkpointing: true
gradient_checkpointing_use_reentrant: true
learning_rate: 2.0e-5

# RUN2 corrected: old step_006250 token-path recipe under FP8 W/A+ViT,
# plus true on-policy GKD. This is not scheduled sampling.
lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  train_lm_head_token_rows: true

data_view:
  prompt_mode: joint
  target_mode: joint
  image_prompt_style: camera_labeled
  prompt_text_style: official_alpamayo
  fuse_history_tokens: true
  teacher_pair_target: false
  hard_view_uses_teacher_cot: true
  enable_teacher_view: false
  enable_action_aux: false
  teacher_traj_hidden_source: hidden

loss_weights:
  gt_cot_loss: 0.08
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.08
  traj_loss: 0.85
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.12
  teacher_traj_hidden_align_loss: 0.08
  teacher_text_boundary_hidden_align_loss: 0.05
  output_format_loss: 0.20
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

traj_hidden_bridge:
  shared_size: 512
  cosine_weight: 0.85
  mse_weight: 0.15
  boundary_cosine_weight: 0.85
  boundary_mse_weight: 0.15
  relation_weight: 0.02
  temporal_weight: 0.03
  temporal_second_weight: 0.5
  latent_spectrum_weight: 0.005

optimization:
  unfreeze_traj_hidden_bridge: true
  traj_hidden_bridge_lr_scale: 1.0
  unfreeze_multimodal_projector: true
  multimodal_projector_lr_scale: 0.15

scheduled_sampling:
  enabled: false

on_policy_gkd:
  enabled: true
  p: 1.0
  p_start: 1.0
  start_step: 0
  ramp_steps: 0
  rollout_tokens: 128
  loss_weight: 0.20
  kd_temperature: 1.5
  do_sample: true
  generation_temperature: 0.6
  top_p: 0.98
  top_k: 0
  replacement_vocab: "<i0>~<i2999>"
  teacher_model_path: /home/pm97/workspace/sukim/base_weights/Alpamayo-1.5-10B
  teacher_dtype: bfloat16
  teacher_attn_implementation: sdpa

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: true
  split: val
  num_samples: 64
  max_new_tokens: 256
  prompt_mode: joint
  target_mode: joint
  image_prompt_style: camera_labeled
  prompt_text_style: official_alpamayo
  fuse_history_tokens: true
  metric_name: free_run_geometry_score
