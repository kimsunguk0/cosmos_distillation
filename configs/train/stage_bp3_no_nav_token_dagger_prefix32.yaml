stage_name: stage_a
epochs: 1.0
batch_size: 1
max_length: 4096
bf16: true
gradient_checkpointing: true
gradient_checkpointing_use_reentrant: true
learning_rate: 1.5e-5

# Proper token-level DAgger:
# - hard_target.cot_text is the student free-run CoT context.
# - hard_target.traj_future_token_ids contains student prefix tokens followed by
#   teacher continuation tokens generated under that student prefix.
# - hard_target.loss_ignore_completion_token_count masks the student prefix out
#   of the loss so only the teacher continuation is supervised.

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  train_lm_head_token_rows: true

data_view:
  prompt_mode: joint
  target_mode: joint
  image_prompt_style: camera_labeled
  prompt_text_style: official_alpamayo
  fuse_history_tokens: true
  teacher_pair_target: false
  hard_view_uses_teacher_cot: false
  enable_teacher_view: false
  enable_action_aux: false

loss_weights:
  gt_cot_loss: 0.0
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.0
  traj_loss: 1.0
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.0
  teacher_traj_hidden_align_loss: 0.0
  teacher_text_boundary_hidden_align_loss: 0.0
  output_format_loss: 0.10
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

scheduled_sampling:
  enabled: false

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: true
  split: val
  num_samples: 64
  max_new_tokens: 256
  prompt_mode: joint
  target_mode: joint
  image_prompt_style: camera_labeled
  prompt_text_style: official_alpamayo
  fuse_history_tokens: true
  metric_name: free_run_geometry_score
