stage_name: stage_a
epochs: 1.0
batch_size: 1
max_length: 4096
bf16: true
gradient_checkpointing: true
attn_implementation: flash_attention_2
learning_rate: 1.0e-4

# Isolated trajectory-token overfit probe.
# If this cannot overfit 16 samples, the bottleneck is the traj readout/token
# rows or the causal alignment, not the CoT/interface losses.

lora:
  rank: 64
  alpha: 128
  dropout: 0.0
  train_lm_head_token_rows: true

data_view:
  prompt_mode: joint
  target_mode: joint
  teacher_pair_target: false
  hard_view_uses_teacher_cot: true
  enable_teacher_view: false
  enable_action_aux: false
  teacher_traj_hidden_source: hidden

loss_weights:
  gt_cot_loss: 0.0
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.0
  traj_loss: 1.50
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.05
  teacher_traj_hidden_align_loss: 0.0
  teacher_text_boundary_hidden_align_loss: 0.0
  output_format_loss: 0.05
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

scheduled_sampling:
  enabled: false
  p: 0.0
  replacement_vocab: "<i0>~<i2999>"

optimization:
  unfreeze_lm_head: false
  freeze_meta_action_head: true
  freeze_traj_aux_head: true
  lm_head_lr_scale: 1.0
  token_row_lr_scale: 4.0
  lm_head_token_row_lr_scale: 4.0

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: false
