stage_name: stage_a
epochs: 3.0
batch_size: 16
max_length: 4096
bf16: true
gradient_checkpointing: true
gradient_checkpointing_use_reentrant: true
learning_rate: 2.0e-5

flex:
  enabled: true
  architecture: multi_level
  tokens_per_image: 64
  expected_images_per_sample: 16
  input_hidden_size: 2048
  hidden_size: 1024
  num_layers: 1
  num_deepstack_levels: 3
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0
  use_camera_time_embeddings: true
  use_local_slot_embeddings: true
  max_camera_types: 16
  compression_mode: per_image
  selection_strategy: uniform

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  train_lm_head_token_rows: true

data_view:
  prompt_mode: joint
  target_mode: joint
  image_prompt_style: camera_labeled
  prompt_text_style: official_alpamayo
  fuse_history_tokens: true
  teacher_pair_target: false
  hard_view_uses_teacher_cot: true
  enable_teacher_view: false
  enable_action_aux: false
  teacher_traj_hidden_source: hidden

loss_weights:
  gt_cot_loss: 0.08
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.08
  traj_loss: 0.85
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.12
  teacher_traj_hidden_align_loss: 0.08
  teacher_text_boundary_hidden_align_loss: 0.05
  output_format_loss: 0.20
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

traj_hidden_bridge:
  shared_size: 512
  cosine_weight: 0.85
  mse_weight: 0.15
  boundary_cosine_weight: 0.85
  boundary_mse_weight: 0.15
  relation_weight: 0.02
  temporal_weight: 0.03
  temporal_second_weight: 0.5
  latent_spectrum_weight: 0.005

optimization:
  freeze_all_parameters: true
  unfreeze_flex_scene_encoder: true
  flex_scene_lr_scale: 2.5
  language_layers_from: 0
  unfreeze_lora_only: true
  language_lora_lr_scale: 1.0
  unfreeze_traj_hidden_bridge: true
  traj_hidden_bridge_lr_scale: 1.0
  unfreeze_multimodal_projector: true
  multimodal_projector_lr_scale: 0.15

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: false
  split: val
  num_samples: 0
  max_new_tokens: 256
  prompt_mode: joint
  target_mode: joint
  image_prompt_style: camera_labeled
  prompt_text_style: official_alpamayo
  fuse_history_tokens: true
  metric_name: free_run_geometry_score
