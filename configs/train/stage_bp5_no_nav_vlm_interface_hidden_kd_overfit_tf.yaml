stage_name: stage_a
epochs: 1.0
batch_size: 1
max_length: 4096
bf16: true
gradient_checkpointing: true
learning_rate: 8.0e-5

# Small-sample teacher-forced overfit probe for BP5.
# Same BP5 supervision mix, but scheduled sampling is disabled so this first
# gate answers only: can the trainable student+bridge memorize the teacher pair?

lora:
  rank: 64
  alpha: 128
  dropout: 0.0
  train_lm_head_token_rows: true

data_view:
  prompt_mode: joint
  target_mode: joint
  teacher_pair_target: false
  hard_view_uses_teacher_cot: true
  enable_teacher_view: false
  enable_action_aux: false
  teacher_traj_hidden_source: hidden

loss_weights:
  gt_cot_loss: 0.08
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.08
  traj_loss: 0.30
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.30
  teacher_traj_hidden_align_loss: 0.20
  teacher_text_boundary_hidden_align_loss: 0.12
  output_format_loss: 0.15
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

traj_hidden_bridge:
  shared_size: 512
  cosine_weight: 0.85
  mse_weight: 0.15
  boundary_cosine_weight: 0.85
  boundary_mse_weight: 0.15
  relation_weight: 0.03
  temporal_weight: 0.04
  temporal_second_weight: 0.5
  latent_spectrum_weight: 0.01

scheduled_sampling:
  enabled: false
  p: 0.0
  replacement_vocab: "<i0>~<i2999>"

optimization:
  unfreeze_traj_hidden_bridge: true
  traj_hidden_bridge_lr_scale: 1.0
  unfreeze_multimodal_projector: true
  multimodal_projector_lr_scale: 0.25

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: false
