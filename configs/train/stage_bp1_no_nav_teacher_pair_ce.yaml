stage_name: stage_a
epochs: 1.0
batch_size: 1
max_length: 4096
bf16: true
gradient_checkpointing: true
learning_rate: 5.0e-5

# BP1: no-nav teacher-pair hard CE.
# The corpus hard target is Alpamayo CoT + Alpamayo 128 future traj tokens.

lora:
  rank: 64
  alpha: 128
  dropout: 0.05

data_view:
  prompt_mode: joint
  target_mode: joint
  teacher_pair_target: false
  hard_view_uses_teacher_cot: false
  enable_teacher_view: false
  enable_action_aux: false

loss_weights:
  gt_cot_loss: 0.10
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.0
  traj_loss: 1.0
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.0
  teacher_traj_hidden_align_loss: 0.0
  output_format_loss: 0.25
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: false
