stage_name: stage_a
epochs: 1.0
batch_size: 1
max_length: 4096
bf16: true
gradient_checkpointing: false
learning_rate: 3.0e-5

# BP4: optimize the deployable no-nav backbone against teacher trajectories.
# Main change from BP3:
# - lower exact traj-token CE pressure
# - strengthen teacher top-k KD
# - turn on teacher final traj hidden alignment
# - score free-run geometry against teacher discrete trajectory, not GT

lora:
  rank: 64
  alpha: 128
  dropout: 0.05

data_view:
  prompt_mode: joint
  target_mode: joint
  teacher_pair_target: false
  hard_view_uses_teacher_cot: true
  enable_teacher_view: false
  enable_action_aux: false
  teacher_traj_hidden_source: hidden

loss_weights:
  gt_cot_loss: 0.06
  teacher_cot_loss: 0.0
  teacher_topk_kd_loss: 0.06
  traj_loss: 0.35
  teacher_traj_loss: 0.0
  teacher_traj_topk_kd_loss: 0.35
  teacher_traj_hidden_align_loss: 0.12
  output_format_loss: 0.20
  meta_action_loss: 0.0
  feature_align_loss: 0.0
  traj_aux_loss: 0.0
  traj_aux_xyz_loss: 0.0
  traj_aux_final_loss: 0.0
  traj_xyz_loss: 0.0
  traj_delta_loss: 0.0
  traj_final_loss: 0.0

traj_hidden_bridge:
  shared_size: 512
  cosine_weight: 0.8
  mse_weight: 0.2
  temporal_weight: 0.05
  temporal_second_weight: 0.5

scheduled_sampling:
  enabled: true
  p: 0.05
  replacement_vocab: "<i0>~<i2999>"

optimization:
  unfreeze_traj_hidden_bridge: true
  traj_hidden_bridge_lr_scale: 1.0

traj_token_reweighting:
  enabled: false

decode_eval:
  enabled: true
  split: val
  num_samples: 32
  max_new_tokens: 256
  prompt_mode: joint
  target_mode: joint
  metric_name: free_run_geometry_score
